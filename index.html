<script>
const copy={ja:{eyebrow:'プロヴァンスから、あなたへ',birthday:'お誕生日おめでとう',intro:'プロヴァンスの小さな贈りものを、あなたへ。',open:'メッセージを開く',footer:'心をこめて',title:'プロヴァンスのひとかけら',letter:'この小包に、プロヴァンスの風を少しだけ。\nいつか、私たちがこの土地をご案内できたら、どんなにうれしいことでしょう…。\n\nまゆ、すてきなお誕生日になりますように。\nAnne-Marie et Alain 🥰 ❤️',close:'閉じる'},fr:{eyebrow:'De la Provence à toi',birthday:'Joyeux anniversaire',intro:'Quelques petits morceaux de Provence pour toi.',open:'Ouvrir le petit mot',footer:'Avec toute notre affection',title:'Un peu de Provence',letter:'Dans ce colis, un peu de l’air de Provence.\nQue nous serions heureux de te faire découvrir un jour...\n\nMayu, nous te souhaitons un très bel anniversaire.\nAnne-Marie et Alain 🥰 ❤️',close:'Fermer'}};
const dialog=document.getElementById('letter');
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{const lang=button.dataset.lang;document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=copy[lang][el.dataset.i18n]);document.querySelectorAll('[data-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===lang)));document.getElementById('close').setAttribute('aria-label',copy[lang].close);}));
document.getElementById('open').addEventListener('click',()=>dialog.showModal());
document.getElementById('close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});

const gifts=[{"id": "maures", "art": "honey", "bg": "#eee5ce", "fr": ["Miel des Maures", "Massif des Maures · 250 g", "Un miel de France récolté dans le massif des Maures. Son étiquette annonce un arôme et un goût puissants, avec une dominante de châtaignier, de lavande, de bruyère blanche, de tilleul et de fleurs du massif.", "Un premier goût de Provence, à savourer à la cuillère ou sur une tartine."], "ja": ["モール山地のはちみつ", "モール山地 · 250 g", "モール山地で採れたフランス産のはちみつ。ラベルには、力強い香りと味わい、そして栗、ラベンダー、白いヒース、菩提樹や山地の花々が主な蜜源と記されています。", "スプーンでひと口、またはパンに添えて。プロヴァンスの味を楽しんでね。"]}, {"id": "nougat", "art": "nougat", "bg": "#eee8d6", "fr": ["Nougat noir de Provence", "Les Ruchers des Maures · 150 g", "Un nougat noir « super tendre », composé de miel et d’amandes, comme l’indique son emballage. Un petit sachet gourmand aux couleurs de Provence.", "Une douceur à partager, en prenant le temps."], "ja": ["プロヴァンスの黒いヌガー", "Les Ruchers des Maures · 150 g", "はちみつとアーモンドで作られた黒いヌガー。パッケージには「とてもやわらかい」と書かれています。プロヴァンスらしい柄の袋に入った、小さな甘い贈りものです。", "ゆっくり味わったり、誰かと分け合ったりして楽しんでね。"]}, {"id": "lavender-honey", "art": "lavenderHoney", "bg": "#f0e8d8", "fr": ["Miel de lavande", "Rucher du Concors · Valensole · 250 g", "Le miel de lavande du coffret Folies de Provence. Le pot porte le nom du Rucher du Concors, à Valensole. Un deuxième miel, pour découvrir une autre saveur.", "Deux pots, deux découvertes : amuse-toi à les goûter et à les comparer."], "ja": ["ラベンダーのはちみつ", "Rucher du Concors · ヴァランソル · 250 g", "「Folies de Provence」のセットに入ったラベンダーのはちみつ。瓶には、ヴァランソルの「Rucher du Concors」の名前が記されています。もうひとつのはちみつで、違う味わいも楽しんでね。", "二つのはちみつを少しずつ食べ比べてみるのも、楽しそう。"]}, {"id": "sachet", "art": "sachet", "bg": "#e4e9e9", "fr": ["Sachet de lavande", "Coffret Folies de Provence", "Un petit sachet de lavande en tissu bleu, décoré d’étoiles. Une façon toute simple de garder près de soi un parfum de Provence.", "À glisser dans une armoire ou un tiroir."], "ja": ["ラベンダーのサシェ", "Folies de Provence のセットから", "星の模様がついた青い布の、小さなラベンダーのサシェ。プロヴァンスの香りを、暮らしのそばに。", "クローゼットや引き出しに、そっとしのばせてね。"]}, {"id": "soap", "art": "soap", "bg": "#eae4ef", "fr": ["Savon à la lavande", "Savon de Marseille · Coffret Folies de Provence", "Un savon de Marseille à la lavande, dans le même coffret que le miel et le sachet parfumé. Une petite touche de Provence pour le quotidien.", "La lavande se retrouve ici sous une autre forme."], "ja": ["ラベンダーの石けん", "マルセイユ石けん · Folies de Provence のセットから", "はちみつとサシェと一緒に入った、ラベンダーのマルセイユ石けん。毎日の暮らしにも、プロヴァンスを少しだけ。", "今度は石けんで、ラベンダーを楽しんでね。"]}, {"id": "bear", "art": "bear", "bg": "#e3eaf0", "fr": ["Le petit nounours bleu", "Garni de lavande séchée", "Un petit nounours bleu qui contient de la lavande séchée. Un compagnon tout doux, avec un peu du parfum de Provence.", "Un souvenir parfumé à garder près de toi."], "ja": ["青い小さなくま", "中には乾燥ラベンダー", "乾燥ラベンダーが入った、青い小さなくま。プロヴァンスの香りをまとった、やさしいおともだちです。", "香りのする思い出として、そばに置いてもらえたらうれしいな。"]}, {"id": "jewelry", "art": "box", "bg": "#e6ece8", "fr": ["La petite boîte à bijoux", "Atelier artisanal · Moustiers-Sainte-Marie", "Une petite boîte à bijoux en faïence, avec son couvercle, provenant d’un atelier artisanal de Moustiers-Sainte-Marie. Un objet à garder pour y abriter tes petits trésors.", "Après les gourmandises et les parfums, un petit morceau de Provence qui reste."], "ja": ["小さなジュエリーボックス", "ムスティエ・サント・マリーの工房から", "ムスティエ・サント・マリーの手仕事の工房から届いた、ふた付きの小さな陶器のジュエリーボックス。大切な小物をしまう場所に。", "甘いものや香りの贈りものと一緒に、形に残るプロヴァンスも。"]}];

const art={honey:jar(false),lavenderHoney:jar(true),nougat:'<path d="m44 107 46-48 67 22-46 48Z" fill="#685044"/><path d="m44 107 67 22v20l-67-22Z" fill="#513b31"/><path d="m111 129 46-48v20l-46 48Z" fill="#796054"/><g fill="#d9c7a0"><ellipse cx="84" cy="89" rx="5" ry="9" transform="rotate(40 84 89)"/><ellipse cx="111" cy="87" rx="5" ry="8" transform="rotate(30 111 87)"/><ellipse cx="112" cy="108" rx="5" ry="8" transform="rotate(65 112 108)"/><ellipse cx="133" cy="89" rx="4" ry="7" transform="rotate(50 133 89)"/><ellipse cx="65" cy="106" rx="4" ry="7" transform="rotate(50 65 106)"/></g>',sachet:'<path d="M77 54h46l-7 20c26 23 34 61 8 72H76c-26-11-18-49 8-72Z" fill="#859da8"/><path d="M79 73h42" stroke="#e8d9ae" stroke-width="5"/><path d="M99 73c-20-18-29 1-2 0 23-18 34 3 4 0m-2 0-11 20m12-20 12 19" stroke="#e8d9ae" fill="none" stroke-width="2"/><g fill="#eddfa9"><path d="m86 97 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/><path d="m115 118 3 5 6 1-4 4 1 6-6-3-5 3 1-6-4-4 6-1Z"/></g>',soap:'<rect x="48" y="67" width="104" height="69" rx="13" fill="#c2b4d1"/><path d="M55 78c0-4 3-6 7-6h76" stroke="#e7deed" fill="none" stroke-width="3"/><rect x="58" y="77" width="84" height="49" rx="7" stroke="#a799b7" fill="none"/><text x="100" y="99" text-anchor="middle" font-size="10" fill="#756a84" font-family="Georgia">MARSEILLE</text><text x="100" y="115" text-anchor="middle" font-size="8" fill="#756a84" font-family="Georgia">LAVANDE</text>',bear:'<g fill="#91aabd"><ellipse cx="100" cy="115" rx="34" ry="37"/><circle cx="69" cy="52" r="16"/><circle cx="131" cy="52" r="16"/><circle cx="100" cy="73" r="35"/><ellipse cx="61" cy="112" rx="15" ry="25" transform="rotate(25 61 112)"/><ellipse cx="139" cy="112" rx="15" ry="25" transform="rotate(-25 139 112)"/><ellipse cx="74" cy="147" rx="20" ry="15"/><ellipse cx="126" cy="147" rx="20" ry="15"/></g><g fill="#c5d3db"><circle cx="69" cy="52" r="9"/><circle cx="131" cy="52" r="9"/><ellipse cx="100" cy="85" rx="18" ry="14"/></g><g fill="#4b626f"><circle cx="87" cy="71" r="2.5"/><circle cx="113" cy="71" r="2.5"/><ellipse cx="100" cy="82" rx="5" ry="3.5"/></g><path d="M100 85v6m-7-1q7 7 14 0" stroke="#4b626f" fill="none"/><path d="m99 108-15-7v16l15-7 17 7v-16Z" fill="#b2a2bf"/>',box:'<path d="M54 88h92v43q-46 20-92 0Z" fill="#e9e9dc" stroke="#91a5a4"/><ellipse cx="100" cy="88" rx="46" ry="14" fill="#f9f8ed" stroke="#91a5a4"/><path d="M58 112q42 18 84 0" stroke="#a4b6b0" fill="none"/><path d="M91 107q9 17 18 0m-9 5v12" fill="none" stroke="#8ca4a6"/><ellipse cx="100" cy="67" rx="47" ry="13" fill="#f9f8ed" stroke="#91a5a4"/><path d="M53 67v8q47 26 94 0v-8" fill="#ececdf" stroke="#91a5a4"/><ellipse cx="100" cy="65" rx="31" ry="6" fill="none" stroke="#a3b6b3"/><ellipse cx="100" cy="56" rx="7" ry="5" fill="#94a9a7"/>'};
function giftVisual(gift){return gift.image?`<img src="${gift.image}" alt="">`:`<svg viewBox="0 0 200 180" fill="none" aria-hidden="true">${art[gift.art]}</svg>`;}
const giftDialog=document.getElementById('gift-dialog');
let selectedGift=null;
function fillGift(gift){
 const lang=document.documentElement.lang;
 const [title,origin,description,note]=gift[lang];
 document.getElementById('gift-detail-title').textContent=title;
 document.getElementById('gift-detail-origin').textContent=origin;
 document.getElementById('gift-detail-text').textContent=description;
 document.getElementById('gift-detail-note').textContent=note;
 const artwork=document.getElementById('gift-detail-art');artwork.innerHTML=giftVisual(gift);artwork.style.setProperty('--gift-bg',gift.bg);
}
function renderGifts(){
 const lang=document.documentElement.lang;
 document.getElementById('collection-kicker').textContent=lang==='fr'?'Dans le colis':'小包の中に';
 document.getElementById('gifts-title').textContent=lang==='fr'?'Ouvre un petit tiroir…':'小さな引き出しを開けてみて';
 document.getElementById('collection-hint').textContent=lang==='fr'?'Trois tiroirs, sept petites attentions.':'三つの引き出しに、七つの贈りもの。';
 document.getElementById('gift-close').setAttribute('aria-label',copy[lang].close);
 const grid=document.getElementById('gift-grid');
 const openDrawer=grid.querySelector('details[open]')?.dataset.drawer;
 grid.replaceChildren();
 const drawers=[
  {id:'taste',fr:'À savourer',ja:'甘いひととき',mark:'◒',color:'#eee5ce',ids:['maures','nougat','lavender-honey']},
  {id:'scent',fr:'Parfums de Provence',ja:'プロヴァンスの香り',mark:'✳',color:'#eae4ef',ids:['sachet','soap','bear']},
  {id:'keep',fr:'Un souvenir à garder',ja:'ずっと大切に',mark:'◇',color:'#e6ece8',ids:['jewelry']}
 ];
 drawers.forEach(group=>{
  const drawer=document.createElement('details');drawer.className='gift-drawer';drawer.name='provence-drawers';drawer.dataset.drawer=group.id;drawer.open=group.id===openDrawer;
  const summary=document.createElement('summary');summary.className='drawer-summary';summary.style.setProperty('--drawer-color',group.color);
  summary.innerHTML=`<span class="drawer-mark" aria-hidden="true">${group.mark}</span><span class="drawer-label"></span><span class="drawer-count">${String(group.ids.length).padStart(2,'0')}</span><span class="drawer-toggle" aria-hidden="true"></span>`;
  summary.querySelector('.drawer-label').textContent=group[lang];
  const tray=document.createElement('div');tray.className='drawer-grid'+(group.ids.length===1?' single':'');
  group.ids.forEach(id=>{
   const index=gifts.findIndex(gift=>gift.id===id);const gift=gifts[index];
  const button=document.createElement('button');button.type='button';button.className='gift-card';button.dataset.gift=gift.id;button.style.setProperty('--gift-bg',gift.bg);button.setAttribute('aria-haspopup','dialog');
  button.innerHTML=`<span class="gift-art"><span class="gift-number">0${index+1}</span>${giftVisual(gift)}<span class="gift-plus" aria-hidden="true">＋</span></span><span class="gift-name"></span><span class="gift-origin"></span>`;
  button.querySelector('.gift-name').textContent=gift[lang][0];button.querySelector('.gift-origin').textContent=gift[lang][1];
  button.addEventListener('click',()=>{selectedGift=gift;fillGift(gift);giftDialog.showModal();});tray.append(button);
  });
  drawer.append(summary,tray);
  drawer.addEventListener('toggle',()=>{if(drawer.open)grid.querySelectorAll('details').forEach(other=>{if(other!==drawer)other.open=false;});});
  grid.append(drawer);
 });
 if(selectedGift)fillGift(selectedGift);
}
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',renderGifts));
document.getElementById('gift-close').addEventListener('click',()=>giftDialog.close());
giftDialog.addEventListener('click',event=>{if(event.target===giftDialog){const r=giftDialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)giftDialog.close();}});
renderGifts();
</script>
