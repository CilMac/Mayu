<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ee">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="De la Provence à toi · プロヴァンスから、あなたへ">
<title>まゆ · De la Provence à toi</title>
<style>
:root{color-scheme:light;--paper:#f7f5ee;--ink:#343e35;--olive:#6b765b;--line:#d9dccd;--muted:#74796b;--sun:#e5bd60}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;-webkit-font-smoothing:antialiased}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23757c5e' filter='url(%23n)' opacity='.25' d='M0 0h180v180H0z'/%3E%3C/svg%3E")}
header{max-width:1120px;margin:auto;padding:26px 30px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:15px;letter-spacing:.18em;color:var(--olive)}.lang{display:flex;gap:3px;border:1px solid var(--line);border-radius:30px;padding:4px}button{font:inherit;color:inherit;cursor:pointer}.lang button{border:0;background:transparent;padding:8px 15px;border-radius:24px;font-family:system-ui,sans-serif;font-size:12px}.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}button:focus-visible{outline:2px solid var(--olive);outline-offset:5px}
main{max-width:860px;margin:auto;padding:24px 24px 60px;text-align:center}.drawing{width:min(310px,65vw);height:190px;margin:0 auto 18px;display:block}.eyebrow{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.29em;text-transform:uppercase;color:var(--muted);margin:12px 0 26px}h1{font-size:clamp(68px,14vw,108px);font-weight:400;letter-spacing:.15em;margin:0 0 10px;padding-left:.15em;line-height:1.3}.birthday{font-size:clamp(19px,4vw,26px);font-weight:400;letter-spacing:.07em;margin:0 0 30px}.rule{width:36px;height:1px;background:#b9c0aa;margin:0 auto 27px}.intro{font-size:16px;line-height:2;max-width:450px;margin:0 auto;color:#616b5e;white-space:pre-line}.open{margin:36px auto 0;padding:15px 27px;display:inline-flex;align-items:center;gap:13px;border:1px solid #b9c0aa;background:transparent;border-radius:3px;font-size:14px;transition:background .2s,transform .2s}.open:hover{background:#eaece1;transform:translateY(-2px)}.open svg{width:22px;height:19px}.foot{margin:62px 0 0;color:var(--muted);font-size:12px;letter-spacing:.1em}.foot span{display:block;margin-top:10px;font-size:10px;font-family:system-ui,sans-serif;letter-spacing:.18em}
dialog{border:1px solid var(--line);background:var(--paper);color:var(--ink);width:min(520px,calc(100% - 36px));padding:62px 32px 45px;text-align:center;box-shadow:0 24px 100px #28352620}dialog::backdrop{background:#30392d66;backdrop-filter:blur(5px)}dialog h2{font-size:26px;font-weight:400;line-height:1.6;margin:10px 0 24px}dialog p{font-size:16px;line-height:2;white-space:pre-line}dialog .close{position:absolute;right:15px;top:10px;border:0;background:none;padding:10px;font-family:system-ui;font-size:23px}.tiny{font-size:30px;color:var(--olive)}@media(max-width:480px){header{padding:20px}main{padding-top:28px}.drawing{height:150px}.intro{font-size:15px}.foot{margin-top:48px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><span class="brand">PROVENCE</span><nav class="lang" aria-label="Language"><button type="button" data-lang="ja" aria-pressed="true">日本語</button><button type="button" data-lang="fr" aria-pressed="false">Français</button></nav></header>
<main>
<svg class="drawing" viewBox="0 0 330 200" fill="none" aria-hidden="true">
<circle cx="219" cy="66" r="39" fill="#ead6a0" opacity=".65"/>
<path d="M47 172c59-10 67-75 111-97 30-15 66-9 105-34" stroke="#7b866b" stroke-width="1.4"/>
<path d="M88 148c-25 4-39-7-43-23 23-4 40 4 43 23Zm15-19c-6-23 2-41 18-48 9 21 0 40-18 48Zm18-27c-23 0-34-13-34-29 22 0 36 13 34 29Zm24-20c-3-22 8-38 23-40 5 21-5 36-23 40Zm20-9c-10-18-7-33 6-43 12 18 9 33-6 43Zm23-5c8-21 22-28 38-23-9 19-24 27-38 23Zm30-8c4-20 17-31 34-28-5 20-17 30-34 28Z" fill="#a5af91"/>
<path d="M93 139c-1-13-6-19-14-23M130 94c5-16 6-25 3-34M177 70c5-15 13-25 23-29" stroke="#7b866b" stroke-width="1.2"/>
<ellipse cx="135" cy="95" rx="5" ry="8" transform="rotate(23 135 95)" fill="#637353"/><ellipse cx="194" cy="77" rx="5" ry="8" transform="rotate(40 194 77)" fill="#637353"/>
<path d="M162 170h94M180 180h49" stroke="#d4d8c8" stroke-linecap="round"/>
</svg>
<p class="eyebrow" data-i18n="eyebrow">プロヴァンスから、あなたへ</p>
<h1>まゆ</h1>
<h2 class="birthday" data-i18n="birthday">お誕生日おめでとう</h2>
<div class="rule"></div>
<p class="intro" data-i18n="intro">プロヴァンスの小さな贈りものを、あなたへ。
ひとつひとつ、心をこめて選びました。</p>
<button class="open" id="open" type="button"><svg viewBox="0 0 24 20" fill="none" aria-hidden="true"><rect x="1" y="2" width="22" height="16" rx="1" stroke="currentColor"/><path d="m2 3 10 8L22 3" stroke="currentColor"/></svg><span data-i18n="open">メッセージを開く</span></button>
<p class="foot">Provence · Japon<span data-i18n="footer">心をこめて</span></p>
</main>
<dialog id="letter" aria-labelledby="letter-title"><button type="button" class="close" id="close" aria-label="閉じる">×</button><div class="tiny" aria-hidden="true">✳</div><h2 id="letter-title" data-i18n="title">プロヴァンスのひとかけら</h2><p data-i18n="letter">この小包に、プロヴァンスの風を少しだけ。
日々の暮らしに、小さな喜びを届けられますように。

すてきなお誕生日になりますように、まゆ。</p></dialog>
<script>
const copy={ja:{eyebrow:'プロヴァンスから、あなたへ',birthday:'お誕生日おめでとう',intro:'プロヴァンスの小さな贈りものを、あなたへ。\nひとつひとつ、心をこめて選びました。',open:'メッセージを開く',footer:'心をこめて',title:'プロヴァンスのひとかけら',letter:'この小包に、プロヴァンスの風を少しだけ。\n日々の暮らしに、小さな喜びを届けられますように。\n\nすてきなお誕生日になりますように、まゆ。',close:'閉じる'},fr:{eyebrow:'De la Provence à toi',birthday:'Joyeux anniversaire',intro:'Quelques petits morceaux de Provence pour toi.\nChaque cadeau a été choisi avec attention.',open:'Ouvrir le petit mot',footer:'Avec toute mon affection',title:'Un peu de Provence',letter:'Dans ce colis, un peu de l’air de Provence.\nEt l’envie de glisser de petites joies dans ton quotidien.\n\nJe te souhaite un très bel anniversaire, Mayu.',close:'Fermer'}};
const dialog=document.getElementById('letter');
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{const lang=button.dataset.lang;document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=copy[lang][el.dataset.i18n]);document.querySelectorAll('[data-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===lang)));document.getElementById('close').setAttribute('aria-label',copy[lang].close);}));
document.getElementById('open').addEventListener('click',()=>dialog.showModal());
document.getElementById('close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
</script>
</body>
</html>
